<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopEasy | Owner Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="navbar">
    <a href="index.html" class="brand">ShopEasy Admin</a>
    <a href="index.html">View Customer Website ↗</a>
  </header>

  <main class="admin-container">

    <!-- Login section -->
    <section id="loginSection">
      <h1>Owner Login</h1>
      <p>Sign in to manage your ShopEasy store.</p>

      <form id="loginForm">
        <label for="loginEmail">Email</label>
        <input
          id="loginEmail"
          type="email"
          required
          placeholder="Your owner email"
        >

        <label for="loginPassword">Password</label>
        <input
          id="loginPassword"
          type="password"
          required
          placeholder="Your password"
        >

        <button type="submit">Login</button>
      </form>

      <p id="loginMessage" role="status"></p>
    </section>

    <!-- Dashboard: hidden until admin login succeeds -->
    <div id="adminDashboard" hidden>

      <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;">
        <div>
          <h1>Store Dashboard</h1>
          <p>Manage your products, categories and store contact details.</p>
        </div>
        <button id="logoutButton" type="button" class="secondary-button">
          Logout
        </button>
      </div>

      <p id="adminMessage" role="status"></p>

      <section>
        <h2>Store settings</h2>

        <label for="storeNameInput">Store name</label>
        <input id="storeNameInput" placeholder="Your store name">

        <label for="phoneInput">WhatsApp number (with country code)</label>
        <input id="phoneInput" placeholder="919999999999">

        <button id="saveStoreButton" type="button">
          Save Store Settings
        </button>
      </section>

      <hr>

      <section>
        <h2>Manage categories</h2>

        <label for="categoryInput">New category</label>
        <input id="categoryInput" placeholder="Example: Shoes">

        <button id="addCategoryButton" type="button">
          Add Category
        </button>

        <div id="categoryManager"></div>
      </section>

      <hr>

      <section>
        <h2 id="formHeading">Add a product</h2>

        <form id="productForm">
          <input type="hidden" id="productId">

          <label for="productName">Product name</label>
          <input id="productName" required placeholder="Product name">

          <label for="productPrice">Price (₹)</label>
          <input id="productPrice" type="number" min="0" step="0.01" required>

          <label for="productCategory">Category</label>
          <select id="productCategory" required></select>

          <label for="productImage">Product image URL</label>
          <input id="productImage" type="url" placeholder="https://example.com/image.jpg">

          <label for="productDescription">Description</label>
          <textarea id="productDescription" rows="3"
            placeholder="Write a short product description"></textarea>

          <button type="submit">Save Product</button>

          <button type="button" class="secondary-button" id="clearFormButton">
            Clear Form
          </button>
        </form>
      </section>

      <hr>

      <section>
        <h2>Your products</h2>
        <div id="productManager"></div>
      </section>

    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="admin.js"></script>

</body>
</html>
