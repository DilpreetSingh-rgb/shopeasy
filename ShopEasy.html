<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ShopEasy – Shop Smart, Save More</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--brand:#5b2ef0;--brand2:#7c5cff;--ink:#1a1446;--mut:#6b6788;--bg:#fbfaff;--card:#f4f1ff;--line:#e5e0fa;--hero1:#dcd6fb;--hero2:#c4baf8;--on:#fff;--shadow:0 10px 30px rgba(70,40,190,.12);
color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--brand:#8b6dff;--brand2:#a58cff;--ink:#efeaff;--mut:#a29fc0;--bg:#0f0c1f;--card:#1a1633;--line:#2c2650;--hero1:#2a2060;--hero2:#3b2b8a;--on:#0f0c1f;--shadow:0 10px 30px rgba(0,0,0,.4);color-scheme:dark}}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink);background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--brand2);outline-offset:2px}
.wrap{max-width:1200px;margin:0 auto;padding:0 20px}
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:16px;height:68px}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:24px;letter-spacing:-.5px;text-decoration:none;color:var(--ink)}
.logo b{color:var(--brand)}.logo svg{width:28px;height:32px}
.search{flex:1;max-width:480px;margin:0 auto;position:relative}
.search input{width:100%;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--card);padding:0 16px 0 44px;font:inherit;color:var(--ink)}
.search svg{position:absolute;left:14px;top:11px;color:var(--mut)}
.ib{position:relative;width:44px;height:44px;border-radius:50%;background:var(--card);display:grid;place-items:center}
.ib.u{background:var(--hero2);color:var(--brand)}
.badge{position:absolute;top:-2px;right:-2px;min-width:20px;height:20px;border-radius:10px;background:var(--brand);color:var(--on);font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px}
.page{display:grid;grid-template-columns:200px 1fr;gap:28px;padding-top:24px;padding-bottom:60px}
aside nav{position:sticky;top:92px;display:flex;flex-direction:column;gap:4px}
.cat{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;font-weight:500;font-size:15px;text-align:left;color:var(--ink)}
.cat svg{width:22px;height:22px;flex:none}
.cat:hover{background:var(--card)}
.cat[aria-pressed=true]{background:var(--brand);color:var(--on);font-weight:700}
.hero{border-radius:28px;background:linear-gradient(120deg,var(--hero1),var(--hero2));padding:44px 48px;display:flex;align-items:center;justify-content:space-between;gap:20px;overflow:hidden;min-height:280px}
.hero h2{font-size:clamp(20px,3vw,30px);font-weight:700}
.hero h1{font-size:clamp(38px,6vw,64px);font-weight:800;color:var(--brand);line-height:1.05;letter-spacing:-1.5px;margin-bottom:10px}
.hero p{font-size:17px;font-weight:500;margin-bottom:22px}
.btn{background:var(--brand);color:var(--on);border-radius:14px;padding:14px 22px;font-weight:700;display:inline-flex;gap:8px;align-items:center;box-shadow:0 8px 20px rgba(91,46,240,.3);transition:transform .15s}
.btn:hover{transform:translateY(-2px)}
.hphone{width:150px;height:270px;flex:none;border-radius:26px;border:7px solid #111;background:linear-gradient(150deg,#7fb2ff,#6a3cf0 55%,#b14df0);transform:rotate(9deg);box-shadow:14px 18px 30px rgba(40,20,120,.3);margin-right:30px}
.perks{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}
.perk{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;font-size:14px;font-weight:600;display:flex;gap:10px;align-items:center}
.perk span{font-size:20px}
.head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:34px 0 16px;flex-wrap:wrap}
.head h3{font-size:28px;font-weight:800;letter-spacing:-.5px}
.sort{height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:0 12px;font:inherit;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;display:flex;flex-direction:column;transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
.pic{height:170px;display:grid;place-items:center;margin-bottom:10px}
.pic svg{height:100%;max-width:100%}
.card h4{font-size:15px;font-weight:600}
.card small{color:var(--mut);font-size:12.5px;margin:2px 0 10px}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:auto}
.price{font-size:20px;font-weight:800;color:var(--brand)}
.add{background:var(--brand);color:var(--on);border-radius:12px;width:40px;height:40px;display:grid;place-items:center;transition:transform .15s}
.add:active{transform:scale(.9)}
.empty{grid-column:1/-1;text-align:center;color:var(--mut);padding:50px 0}
footer{border-top:1px solid var(--line);padding:26px 0;color:var(--mut);font-size:14px;text-align:center}
.scrim{position:fixed;inset:0;background:rgba(10,5,40,.5);opacity:0;pointer-events:none;transition:opacity .25s;z-index:30}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(400px,100%);background:var(--bg);z-index:31;transform:translateX(100%);transition:transform .3s;display:flex;flex-direction:column;box-shadow:var(--shadow);padding-top:env(safe-area-inset-top,0px)}
.drawer.on{transform:none}
.dh{display:flex;justify-content:space-between;align-items:center;padding:20px;border-bottom:1px solid var(--line);font-weight:800;font-size:20px}
.items{flex:1;overflow:auto;padding:12px 20px}
.it{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.it .t{width:56px;height:56px;background:var(--card);border-radius:12px;display:grid;place-items:center;flex:none;padding:4px}
.it .t svg{height:100%}
.it .n{flex:1;font-weight:600;font-size:14px}.it .n div{color:var(--brand);font-weight:700}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:28px;height:28px;border-radius:8px;background:var(--card);font-weight:700}
.df{padding:20px;border-top:1px solid var(--line)}
.tot{display:flex;justify-content:space-between;font-weight:800;font-size:20px;margin-bottom:14px}
.df .btn{width:100%;justify-content:center}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:600;opacity:0;transition:.25s;z-index:40;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (max-width:860px){
 .page{grid-template-columns:1fr;gap:14px;padding-top:14px}
 aside nav{position:static;flex-direction:row;overflow-x:auto;gap:8px;padding-bottom:6px}
 .cat{flex:none;flex-direction:column;gap:4px;font-size:12.5px;padding:10px 12px;min-width:76px;align-items:center;text-align:center}
 .hero{padding:26px 22px;min-height:210px;border-radius:22px}.hphone{width:90px;height:165px;border-width:5px;margin-right:6px}
 .perks{grid-template-columns:1fr}.search{display:none}.bar{justify-content:space-between}.logo{margin-right:auto}
 .msearch{display:block!important}
}
.msearch{display:none;padding:0 0 4px}.msearch .search{display:block;max-width:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header><div class="wrap">
 <div class="bar">
  <a class="logo" href="#"><svg viewBox="0 0 30 34"><path d="M5 11h20l2 20a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3z" fill="#6a3cf0"/><path d="M10 14V9a5 5 0 0 1 10 0v5" fill="none" stroke="#6a3cf0" stroke-width="2.5" stroke-linecap="round"/><circle cx="11" cy="19" r="1.6" fill="#fff"/><circle cx="19" cy="19" r="1.6" fill="#fff"/></svg>Shop<b>Easy</b></a>
  <label class="search"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input type="search" id="q" placeholder="Search products" aria-label="Search products"></label>
  <button class="ib" id="theme" aria-label="Toggle dark mode">◐</button>
  <button class="ib" id="cartBtn" aria-label="Open cart"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2l2.5 11h10L20 8H6.500"/><circle cx="9" cy="19.500" r="1.500"/><circle cx="17" cy="19.500" r="1.500"/></svg><span class="badge" id="count">0</span></button>
  <button class="ib u" aria-label="Account"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="8" r="4.500"/><path d="M3.500 21a8.500 8.500 0 0 1 17 0z"/></svg></button>
 </div>
 <div class="msearch"><label class="search"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input type="search" id="q2" placeholder="Search products" aria-label="Search products"></label></div>
</div></header>

<div class="wrap page">
 <aside><nav id="cats" aria-label="Categories"></nav></aside>
 <main>
  <section class="hero">
   <div>
    <h2>Discover Amazing</h2><h1>Products</h1>
    <p>Shop Smart • Save More</p>
    <a class="btn" href="#products">Explore now <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.500" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
   </div>
   <div class="hphone" aria-hidden="true"></div>
  </section>
  <div class="perks"><div class="perk"><span>🚚</span>Free delivery over ₹999</div><div class="perk"><span>↩️</span>7-day easy returns</div><div class="perk"><span>🔒</span>Secure payments</div></div>
  <div class="head" id="products"><h3 id="title">Our Products</h3>
   <select class="sort" id="sort" aria-label="Sort products"><option value="f">Featured</option><option value="l">Price: low to high</option><option value="h">Price: high to low</option></select></div>
  <div class="grid" id="grid"></div>
 </main>
</div>
<footer>© 2026 ShopEasy · Shop smart, save more.</footer>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Cart">
 <div class="dh">Your cart <button class="ib" id="close" aria-label="Close cart">✕</button></div>
 <div class="items" id="items"></div>
 <div class="df"><div class="tot"><span>Total</span><span id="total">₹0</span></div><button class="btn" id="checkout">Checkout</button></div>
</aside>
<div class="toast" id="toast" role="status"></div>

<script>
var S={
phone:'<svg viewBox="0 0 70 120"><rect x="8" y="2" width="54" height="116" rx="8" fill="#15151c"/><rect x="12" y="6" width="46" height="108" rx="5" fill="url(#g1)"/><rect x="26" y="6" width="18" height="4" rx="2" fill="#15151c"/><defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7fb8ff"/><stop offset=".5" stop-color="#6a3cf0"/><stop offset="1" stop-color="#b14df0"/></linearGradient></defs></svg>',
buds:'<svg viewBox="0 0 120 100"><path d="M10 45h100v22a26 26 0 0 1-26 26H36a26 26 0 0 1-26-26z" fill="#2a2d38"/><path d="M10 45a50 28 0 0 1 100 0z" fill="#1e2029"/><ellipse cx="38" cy="38" rx="17" ry="20" fill="#14151b"/><ellipse cx="82" cy="36" rx="17" ry="20" fill="#14151b"/><circle cx="38" cy="44" r="6" fill="#33363f"/><circle cx="82" cy="42" r="6" fill="#33363f"/></svg>',
watch:'<svg viewBox="0 0 110 120"><path d="M35 5h40l5 25H30zM30 90h50l-5 25H40z" fill="#2c2f3a"/><rect x="20" y="25" width="70" height="72" rx="18" fill="#3a3d49"/><rect x="26" y="31" width="58" height="60" rx="13" fill="#0e0f14"/><text x="55" y="62" text-anchor="middle" font-size="20" font-weight="600" fill="#fff" font-family="sans-serif">10</text><text x="55" y="83" text-anchor="middle" font-size="20" font-weight="600" fill="#fff" font-family="sans-serif">47</text></svg>',
bag:'<svg viewBox="0 0 100 120"><path d="M38 20a12 12 0 0 1 24 0" fill="none" stroke="#2b2e38" stroke-width="5"/><path d="M20 40a20 20 0 0 1 20-20h20a20 20 0 0 1 20 20v68a8 8 0 0 1-8 8H28a8 8 0 0 1-8-8z" fill="#2f323d"/><rect x="28" y="68" width="44" height="32" rx="6" fill="#262933"/><path d="M28 76h44" stroke="#4a4e5c" stroke-width="2"/></svg>',
shoe:'<svg viewBox="0 0 150 90"><path d="M8 60c0-10 6-14 14-16l30-12 12 8 22-4c20 0 30 6 40 16 6 6 12 8 14 14 0 10-10 14-24 14H22C12 80 8 72 8 60z" fill="#f4f4f7" stroke="#bdbdc9" stroke-width="1.500"/><path d="M12 68h128" stroke="#cfcfd8" stroke-width="3"/><path d="M52 32l8 8M60 30l8 8M68 29l8 8" stroke="#bbb" stroke-width="2"/></svg>',
bottle:'<svg viewBox="0 0 60 130"><rect x="16" y="2" width="28" height="12" rx="3" fill="#5d6068"/><rect x="18" y="14" width="24" height="8" fill="#3a6f93"/><rect x="8" y="22" width="44" height="100" rx="18" fill="#2c7fa6"/><rect x="14" y="30" width="6" height="80" rx="3" fill="#4fa3c8" opacity=".6"/></svg>'};
var P=[
{id:1,n:'Smartphone 5G',p:19999,c:'electronics',s:'Fast 5G, bright display',i:'phone'},
{id:2,n:'Wireless Earbuds',p:2499,c:'electronics',s:'Noise reduction, 24h battery',i:'buds'},
{id:3,n:'Smart Watch',p:9999,c:'electronics',s:'Health and sleep tracking',i:'watch'},
{id:4,n:'Travel Backpack',p:1999,c:'fashion',s:'Water-resistant, 30L',i:'bag'},
{id:5,n:'Sports Shoes',p:3499,c:'sports',s:'Lightweight daily trainers',i:'shoe'},
{id:6,n:'Water Bottle',p:799,c:'sports',s:'Insulated steel, 750 ml',i:'bottle'}];
var C=[['all','Products','<rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/>'],
['electronics','Electronics','<rect x="3" y="4" width="18" height="12" rx="1.500"/><path d="M12 16v4M8 20h8"/>'],
['fashion','Fashion','<path d="M8 3 3 6l2 5 3-1v11h8V10l3 1 2-5-5-3a4 4 0 0 1-8 0z"/>'],
['home','Home &amp; Living','<path d="M3 11 12 3l9 8M5 9.500V21h14V9.500"/><path d="M10 21v-6h4v6"/>'],
['books','Books','<path d="M12 6c-2-2-5-2.500-9-2.500V18c4 0 7 .5 9 2.500 2-2 5-2.500 9-2.500V3.500C17 3.500 14 4 12 6zM12 6v14.500"/>'],
['sports','Sports','<circle cx="12" cy="12" r="9"/><path d="M12 3v18M3 12h18"/>'],
['beauty','Beauty','<path d="M12 20c-4-2-6-6-5-11 2 1 4 3 5 6 1-3 3-5 5-6 1 5-1 9-5 11z"/>'],
['others','Others','<circle cx="5" cy="12" r="1.800"/><circle cx="12" cy="12" r="1.800"/><circle cx="19" cy="12" r="1.800"/>']];
var cat='all',term='',sort='f',cart={};
try{cart=JSON.parse(localStorage.getItem('se_cart')||'{}')}catch(e){}
var $=function(i){return document.getElementById(i)};
var fmt=function(n){return '₹'+n.toLocaleString('en-IN')};
function save(){try{localStorage.setItem('se_cart',JSON.stringify(cart))}catch(e){}}
function toast(t){var e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(function(){e.classList.remove('on')},1600)}
function drawCats(){$('cats').innerHTML=C.map(function(c){return '<button class="cat" data-c="'+c[0]+'" aria-pressed="'+(c[0]===cat)+'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.800" stroke-linecap="round" stroke-linejoin="round">'+c[2]+'</svg>'+c[1]+'</button>'}).join('')}
function drawGrid(){
 var l=P.filter(function(p){return(cat==='all'||p.c===cat)&&p.n.toLowerCase().indexOf(term)>-1});
 if(sort==='l')l.sort(function(a,b){return a.p-b.p});if(sort==='h')l.sort(function(a,b){return b.p-a.p});
 $('title').textContent=cat==='all'?'Our Products':C.filter(function(c){return c[0]===cat})[0][1].replace('&amp;','&');
 $('grid').innerHTML=l.length?l.map(function(p){return '<article class="card"><div class="pic">'+S[p.i]+'</div><h4>'+p.n+'</h4><small>'+p.s+'</small><div class="row"><span class="price">'+fmt(p.p)+'</span><button class="add" data-id="'+p.id+'" aria-label="Add '+p.n+' to cart"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.500" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button></div></article>'}).join(''):'<p class="empty">No products found. Try another search or category.</p>'}
function drawCart(){
 var ids=Object.keys(cart),n=0,t=0;
 $('items').innerHTML=ids.length?ids.map(function(id){var p=P.filter(function(x){return x.id==id})[0],q=cart[id];n+=q;t+=q*p.p;
  return '<div class="it"><div class="t">'+S[p.i]+'</div><div class="n">'+p.n+'<div>'+fmt(p.p)+'</div></div><div class="qty"><button data-m="'+id+'" aria-label="Decrease">−</button>'+q+'<button data-a="'+id+'" aria-label="Increase">+</button></div></div>'}).join(''):'<p class="empty">Your cart is empty. Add something you like.</p>';
 $('count').textContent=n;$('total').textContent=fmt(t);save()}
function open(o){$('drawer').classList.toggle('on',o);$('scrim').classList.toggle('on',o)}
$('cats').onclick=function(e){var b=e.target.closest('.cat');if(!b)return;cat=b.dataset.c;drawCats();drawGrid()};
$('grid').onclick=function(e){var b=e.target.closest('.add');if(!b)return;var id=b.dataset.id;cart[id]=(cart[id]||0)+1;drawCart();toast('Added to cart')};
$('items').onclick=function(e){var b=e.target.closest('button');if(!b)return;
 if(b.dataset.a)cart[b.dataset.a]++;if(b.dataset.m&&--cart[b.dataset.m]<1)delete cart[b.dataset.m];drawCart()};
function onq(e){term=e.target.value.trim().toLowerCase();$('q').value=$('q2').value=e.target.value;drawGrid()}
$('q').oninput=onq;$('q2').oninput=onq;
$('sort').onchange=function(e){sort=e.target.value;drawGrid()};
$('cartBtn').onclick=function(){open(true)};$('close').onclick=$('scrim').onclick=function(){open(false)};
$('checkout').onclick=function(){if(!Object.keys(cart).length)return toast('Your cart is empty');cart={};drawCart();open(false);toast('Order placed. Thank you!')};
$('theme').onclick=function(){var r=document.documentElement,d=getComputedStyle(r).colorScheme==='dark';r.setAttribute('data-theme',d?'light':'dark');
 if(!d){var s=document.createElement('style');s.id='dk';s.textContent=':root[data-theme="dark"]{--brand:#8b6dff;--brand2:#a58cff;--ink:#efeaff;--mut:#a29fc0;--bg:#0f0c1f;--card:#1a1633;--line:#2c2650;--hero1:#2a2060;--hero2:#3b2b8a;--on:#0f0c1f;color-scheme:dark}';document.head.appendChild(s)}};
document.addEventListener('keydown',function(e){if(e.key==='Escape')open(false)});
drawCats();drawGrid();drawCart();
</script>
</body>
</html>
